<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SabiTrack — Поиск нянь</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
:root{--pink-50:#fff5f7;--pink-100:#ffe4eb;--pink-200:#ffc2d1;--pink-400:#ff6b96;--pink-500:#e84a78;--pink-600:#c73461;--pink-700:#9c2248;--cream:#fdf8f9;--text-dark:#2d1a22;--text-mid:#6b3d52;--text-muted:#a07080;--border:rgba(200,120,150,0.18);--border-strong:rgba(200,120,150,0.32);--shadow-soft:0 2px 20px rgba(180,80,120,0.07);--shadow-card:0 4px 32px rgba(180,80,120,0.11);--r-sm:10px;--r-md:14px;--r-lg:20px;--r-xl:28px;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--text-dark);min-height:100vh;overflow-x:hidden;}
.topbar{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:14px 32px;background:rgba(253,248,249,0.92);backdrop-filter:blur(18px);border-bottom:1px solid var(--border);}
.logo{font-family:'DM Serif Display',serif;font-size:22px;}.logo span{color:var(--pink-500);font-style:italic;}
.role-badge{display:inline-flex;align-items:center;gap:7px;padding:6px 16px;border-radius:40px;font-size:13px;font-weight:500;border:1.5px solid;}
.role-badge .dot{width:7px;height:7px;border-radius:50%;}
.role-badge-parent{background:#eef4ff;color:#1a4fb5;border-color:#b8d0f8;}.role-badge-parent .dot{background:#2563eb;}
.role-badge-nanny{background:#edfbf1;color:#166534;border-color:#a7e9c0;}.role-badge-nanny .dot{background:#16a34a;}
.role-badge-admin{background:#fff0f0;color:#991b1b;border-color:#fca5a5;}.role-badge-admin .dot{background:#dc2626;}
.user-chip{display:flex;align-items:center;gap:9px;font-size:14px;color:var(--text-mid);}
.user-avatar{width:34px;height:34px;border-radius:50%;background:var(--pink-200);color:var(--pink-700);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;}
/* balance chip in topbar */
.balance-chip{display:inline-flex;align-items:center;gap:6px;padding:5px 14px;border-radius:40px;background:#fff;border:1.5px solid #a7e9c0;font-size:13px;font-weight:600;color:#166534;cursor:pointer;transition:all .18s;}
.balance-chip:hover{background:#edfbf1;}
.balance-chip.low{border-color:#fca5a5;color:#991b1b;}
.layout{display:flex;min-height:calc(100vh - 61px);}
.sidebar{width:220px;flex-shrink:0;background:var(--pink-50);border-right:1px solid var(--border);padding:24px 14px;display:flex;flex-direction:column;gap:3px;}
.nav-section{font-size:11px;font-weight:600;letter-spacing:.8px;color:var(--text-muted);text-transform:uppercase;padding:14px 12px 6px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:var(--r-sm);font-size:14px;color:var(--text-mid);cursor:pointer;transition:all .18s;border:none;background:transparent;width:100%;text-align:left;}
.nav-item:hover{background:var(--pink-100);color:var(--pink-600);}
.nav-item.active{background:var(--pink-200);color:var(--pink-700);font-weight:600;}
.nav-icon{font-size:15px;width:20px;text-align:center;}
.main{flex:1;padding:32px;overflow-y:auto;}
.screen{display:none;animation:fadeUp .28s ease;}.screen.active{display:block;}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
.greeting{margin-bottom:28px;}.greeting h1{font-family:'DM Serif Display',serif;font-size:30px;line-height:1.2;}
.greeting h1 span{color:var(--pink-500);font-style:italic;}.greeting p{font-size:15px;color:var(--text-muted);margin-top:6px;}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:28px;}
.stat-card{background:#fff;border-radius:var(--r-lg);padding:20px;border:1px solid var(--border);box-shadow:var(--shadow-soft);position:relative;overflow:hidden;}
.stat-card::before{content:'';position:absolute;top:-18px;right:-18px;width:72px;height:72px;border-radius:50%;background:var(--pink-100);opacity:.55;}
.stat-label{font-size:12px;font-weight:500;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;}
.stat-value{font-family:'DM Serif Display',serif;font-size:32px;color:var(--pink-600);line-height:1;}
.stat-sub{font-size:12px;color:var(--text-muted);margin-top:6px;}
.sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.sec-title{font-family:'DM Serif Display',serif;font-size:20px;color:var(--text-dark);}
.sec-link{font-size:13px;color:var(--pink-500);cursor:pointer;}.sec-link:hover{text-decoration:underline;}
.nanny-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
.nanny-card{background:#fff;border-radius:var(--r-lg);border:1px solid var(--border);padding:20px;box-shadow:var(--shadow-soft);transition:transform .2s,box-shadow .2s;}
.nanny-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-card);}
.nanny-head{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
.nanny-avatar{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;flex-shrink:0;border:2px solid var(--pink-200);}
.av-a{background:#fce4ec;color:#c2185b;}.av-b{background:#e8eaf6;color:#3949ab;}.av-c{background:#e8f5e9;color:#2e7d32;}.av-d{background:#fff8e1;color:#f57f17;}.av-e{background:#fce4ec;color:#880e4f;}
.nanny-info .name{font-size:15px;font-weight:600;}.nanny-info .exp{font-size:12px;color:var(--text-muted);margin-top:2px;}
.nanny-rows{display:flex;flex-direction:column;gap:7px;margin-bottom:14px;}
.nanny-row{display:flex;align-items:center;justify-content:space-between;}
.row-label{font-size:13px;color:var(--text-muted);}
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:500;}
.badge-green{background:#e8f5e9;color:#2e7d32;}.badge-amber{background:#fff8e1;color:#e65100;}
.badge-pink{background:var(--pink-100);color:var(--pink-600);}.badge-blue{background:#e3f2fd;color:#1565c0;}
.badge-gray{background:#f5f5f5;color:#757575;}.badge-red{background:#ffebee;color:#c62828;}
.stars{color:#f4a620;font-size:14px;letter-spacing:1px;}
.btn{display:inline-block;padding:9px 18px;border-radius:var(--r-sm);border:1px solid var(--border-strong);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:all .18s;background:transparent;color:var(--text-mid);}
.btn:hover{background:var(--pink-100);color:var(--pink-600);}.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn-primary{background:var(--pink-500);color:#fff;border-color:var(--pink-500);}.btn-primary:hover{background:var(--pink-600);}
.btn-block{width:100%;text-align:center;}.btn-sm{padding:5px 12px;font-size:12px;}
.btn-success{background:#e8f5e9;color:#2e7d32;border-color:#a5d6a7;}.btn-success:hover{background:#c8e6c9;}
.btn-danger{background:#ffebee;color:#c62828;border-color:#ef9a9a;}.btn-danger:hover{background:#ffcdd2;}
.search-bar{display:flex;gap:10px;margin-bottom:22px;background:#fff;border-radius:var(--r-lg);padding:10px 14px;border:1px solid var(--border);box-shadow:var(--shadow-soft);}
.search-input{flex:1;border:none;outline:none;font-family:'DM Sans',sans-serif;font-size:14px;color:var(--text-dark);background:transparent;}
.search-input::placeholder{color:var(--text-muted);}
.search-select{border:none;outline:none;font-family:'DM Sans',sans-serif;font-size:13px;color:var(--text-mid);background:var(--pink-50);border-radius:var(--r-sm);padding:6px 10px;cursor:pointer;}
.order-list{display:flex;flex-direction:column;gap:12px;}
.order-card{background:#fff;border-radius:var(--r-lg);border:1px solid var(--border);padding:16px 20px;display:flex;align-items:center;justify-content:space-between;box-shadow:var(--shadow-soft);gap:12px;flex-wrap:wrap;}
.order-card.urgent{border-left:3px solid var(--pink-400);}
.order-title{font-size:15px;font-weight:600;}.order-meta{font-size:13px;color:var(--text-muted);margin-top:3px;}
.order-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;flex-shrink:0;}
.profile-card{background:#fff;border-radius:var(--r-xl);border:1px solid var(--border);padding:28px;max-width:560px;box-shadow:var(--shadow-card);}
.profile-head{display:flex;align-items:center;gap:16px;margin-bottom:20px;}
.profile-avatar-lg{width:64px;height:64px;border-radius:50%;font-size:20px;font-weight:700;border:3px solid var(--pink-200);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.profile-name{font-family:'DM Serif Display',serif;font-size:20px;}.profile-role-label{font-size:13px;color:var(--text-muted);margin-top:3px;}
.divider{height:1px;background:var(--border);margin:18px 0;}
.field-row{display:flex;gap:12px;margin-bottom:10px;}
.field-label{font-size:13px;color:var(--text-muted);width:120px;flex-shrink:0;}.field-val{font-size:14px;color:var(--text-dark);}
.admin-tbl{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border-radius:var(--r-lg);border:1px solid var(--border);overflow:hidden;box-shadow:var(--shadow-soft);font-size:14px;}
.admin-tbl th{padding:12px 16px;text-align:left;background:var(--pink-50);color:var(--text-muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border);}
.admin-tbl td{padding:12px 16px;border-bottom:1px solid var(--border);color:var(--text-dark);vertical-align:middle;}
.admin-tbl tr:last-child td{border-bottom:none;}.admin-tbl tr:hover td{background:var(--pink-50);}
#page-login{min-height:100vh;display:flex;flex-direction:column;}
.login-topbar{padding:16px 32px;display:flex;align-items:center;border-bottom:1px solid var(--border);background:rgba(253,248,249,.9);}
.login-wrap{flex:1;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 70% 20%,var(--pink-100) 0%,transparent 60%),radial-gradient(ellipse at 20% 80%,#ffe0eb 0%,transparent 55%);}
.login-card{background:#fff;border-radius:var(--r-xl);border:1px solid var(--border);padding:36px 40px;width:380px;box-shadow:var(--shadow-card);}
.login-brand{font-family:'DM Serif Display',serif;font-size:28px;color:var(--text-dark);margin-bottom:4px;}.login-brand span{color:var(--pink-500);font-style:italic;}
.login-sub{font-size:14px;color:var(--text-muted);margin-bottom:28px;}
.login-tabs{display:flex;background:var(--pink-50);border-radius:var(--r-sm);padding:3px;margin-bottom:24px;}
.login-tab{flex:1;padding:8px;text-align:center;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;border:none;background:transparent;color:var(--text-muted);transition:all .2s;}
.login-tab.active{background:#fff;color:var(--pink-600);box-shadow:0 1px 6px rgba(180,80,120,0.12);}
.form-group{margin-bottom:16px;}
.form-label{display:block;font-size:12px;font-weight:600;color:var(--text-mid);margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px;}
.form-input{width:100%;padding:11px 14px;border-radius:var(--r-sm);border:1px solid var(--border-strong);font-family:'DM Sans',sans-serif;font-size:14px;color:var(--text-dark);background:var(--pink-50);outline:none;transition:border-color .2s;}
.form-input:focus{border-color:var(--pink-400);background:#fff;}
textarea.form-input{resize:vertical;min-height:72px;}
.login-footer{text-align:center;margin-top:20px;font-size:13px;color:var(--text-muted);}.login-footer a{color:var(--pink-500);cursor:pointer;}
.error-msg{background:#ffebee;color:#c62828;border-radius:var(--r-sm);padding:10px 14px;font-size:13px;margin-bottom:14px;display:none;}
.reg-extra{display:none;}
.toast{position:fixed;bottom:28px;right:28px;background:var(--text-dark);color:#fff;font-size:14px;padding:12px 20px;border-radius:var(--r-md);box-shadow:0 8px 32px rgba(0,0,0,0.18);opacity:0;transform:translateY(10px);transition:all .3s;pointer-events:none;z-index:9999;max-width:320px;}
.toast.show{opacity:1;transform:none;}.toast.success{background:#2e7d32;}.toast.error{background:#c62828;}
.loader{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px;}
@keyframes spin{to{transform:rotate(360deg);}}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:300;animation:mfadeIn .18s ease;}
@keyframes mfadeIn{from{opacity:0;}to{opacity:1;}}
.modal-card{background:#fff;border-radius:var(--r-xl);padding:32px;width:480px;max-width:95vw;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-card);animation:mslideUp .22s ease;}
@keyframes mslideUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:none;}}
.modal-title{font-family:'DM Serif Display',serif;font-size:22px;margin-bottom:20px;color:var(--text-dark);}
.modal-actions{display:flex;gap:10px;margin-top:20px;}.modal-actions .btn{flex:1;text-align:center;}
.info-banner{background:#fff8e1;border:1px solid #ffe082;border-radius:var(--r-md);padding:14px 18px;font-size:14px;color:#7c5000;margin-bottom:18px;}
.toggle-avail-btn{display:inline-flex;align-items:center;gap:8px;padding:9px 20px;border-radius:40px;font-size:14px;font-weight:600;cursor:pointer;border:1.5px solid;transition:all .2s;margin-bottom:16px;}
.toggle-avail-btn.is-free{background:#edfbf1;color:#166534;border-color:#a7e9c0;}
.toggle-avail-btn.is-busy{background:#fff0f0;color:#991b1b;border-color:#fca5a5;}
.edit-profile-form{background:var(--pink-50);border:1px solid var(--border);border-radius:var(--r-lg);padding:22px;margin-top:18px;}
.child-card{background:#fff;border:1px solid var(--border);border-radius:var(--r-lg);padding:14px 18px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;}
.child-name{font-size:15px;font-weight:600;}.child-meta{font-size:13px;color:var(--text-muted);margin-top:2px;}
.doc-upload-area{border:2px dashed var(--border-strong);border-radius:var(--r-lg);padding:28px;text-align:center;cursor:pointer;transition:all .2s;margin-bottom:16px;}
.doc-upload-area:hover{border-color:var(--pink-400);background:var(--pink-50);}.doc-upload-area input{display:none;}
.doc-card{background:#fff;border:1px solid var(--border);border-radius:var(--r-lg);padding:14px 18px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
.doc-icon{font-size:28px;flex-shrink:0;}
.doc-info .doc-title{font-size:14px;font-weight:600;color:var(--text-dark);}
.doc-info .doc-meta{font-size:12px;color:var(--text-muted);margin-top:2px;}
.doc-type-badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600;background:var(--pink-100);color:var(--pink-700);margin-top:4px;}
.chat-wrap{display:flex;flex-direction:column;height:calc(100vh - 200px);min-height:400px;background:#fff;border-radius:var(--r-xl);border:1px solid var(--border);box-shadow:var(--shadow-card);overflow:hidden;}
.chat-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;background:var(--pink-50);}
.chat-header-avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0;background:var(--pink-200);color:var(--pink-700);}
.chat-header-info .chat-name{font-weight:600;font-size:15px;}
.chat-header-info .chat-sub{font-size:12px;color:var(--text-muted);}
.chat-messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:10px;background:#fafafa;}
.msg-row{display:flex;flex-direction:column;max-width:72%;}
.msg-row.mine{align-self:flex-end;align-items:flex-end;}
.msg-row.theirs{align-self:flex-start;align-items:flex-start;}
.msg-bubble{padding:10px 14px;border-radius:18px;font-size:14px;line-height:1.5;word-break:break-word;}
.msg-row.mine .msg-bubble{background:var(--pink-500);color:#fff;border-bottom-right-radius:4px;}
.msg-row.theirs .msg-bubble{background:#fff;color:var(--text-dark);border:1px solid var(--border);border-bottom-left-radius:4px;}
.msg-meta{font-size:11px;color:var(--text-muted);margin-top:3px;}
.chat-input-area{padding:16px 20px;border-top:1px solid var(--border);display:flex;gap:10px;align-items:flex-end;background:#fff;}
.chat-input{flex:1;border:1px solid var(--border-strong);border-radius:var(--r-md);padding:10px 14px;font-family:'DM Sans',sans-serif;font-size:14px;outline:none;resize:none;min-height:44px;max-height:120px;background:var(--pink-50);}
.chat-input:focus{border-color:var(--pink-400);background:#fff;}
.chat-send-btn{width:44px;height:44px;border-radius:50%;background:var(--pink-500);border:none;color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .18s;flex-shrink:0;}
.chat-send-btn:hover{background:var(--pink-600);}
.chat-empty{text-align:center;color:var(--text-muted);padding:40px 20px;font-size:14px;}
.chat-list-item{background:#fff;border:1px solid var(--border);border-radius:var(--r-lg);padding:14px 18px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:all .18s;margin-bottom:10px;}
.chat-list-item:hover{background:var(--pink-50);border-color:var(--pink-300);}
/* WALLET */
.wallet-card{background:linear-gradient(135deg,#e84a78 0%,#c73461 100%);border-radius:var(--r-xl);padding:28px;color:#fff;margin-bottom:24px;position:relative;overflow:hidden;}
.wallet-card::before{content:'';position:absolute;top:-30px;right:-30px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,0.08);}
.wallet-card::after{content:'';position:absolute;bottom:-20px;left:40px;width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,0.06);}
.wallet-label{font-size:13px;font-weight:500;opacity:.8;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;}
.wallet-amount{font-family:'DM Serif Display',serif;font-size:46px;line-height:1;font-weight:400;margin-bottom:6px;}
.wallet-sub{font-size:13px;opacity:.75;}
.wallet-actions{display:flex;gap:12px;margin-top:22px;position:relative;z-index:1;}
.wallet-btn{padding:10px 20px;border-radius:40px;border:none;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;}
.wallet-btn-white{background:#fff;color:var(--pink-600);}
.wallet-btn-white:hover{background:var(--pink-50);}
.wallet-btn-outline{background:rgba(255,255,255,0.15);color:#fff;border:1.5px solid rgba(255,255,255,0.4);}
.wallet-btn-outline:hover{background:rgba(255,255,255,0.25);}
.tx-item{background:#fff;border:1px solid var(--border);border-radius:var(--r-lg);padding:14px 18px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
.tx-icon{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.tx-icon.pay{background:#fff0f0;}.tx-icon.topup{background:#edfbf1;}.tx-icon.earn{background:#e3f2fd;}
.tx-info .tx-title{font-size:14px;font-weight:600;color:var(--text-dark);}
.tx-info .tx-meta{font-size:12px;color:var(--text-muted);margin-top:2px;}
.tx-amount{font-size:16px;font-weight:700;}.tx-amount.minus{color:#c62828;}.tx-amount.plus{color:#2e7d32;}
.commission-info{background:#f3f0ff;border:1px solid #c4b5fd;border-radius:var(--r-md);padding:12px 16px;font-size:13px;color:#5b21b6;margin-top:12px;}
.admin-wallet-card{background:#fff;border-radius:var(--r-xl);border:2px solid var(--pink-200);padding:24px;margin-bottom:24px;display:flex;align-items:center;gap:24px;}
.admin-wallet-icon{font-size:48px;}
.admin-wallet-info .aw-label{font-size:13px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;}
.admin-wallet-info .aw-amount{font-family:'DM Serif Display',serif;font-size:38px;color:var(--pink-600);}
.topup-quick-amounts{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
.topup-quick-amounts button{padding:8px 16px;border-radius:40px;border:1.5px solid var(--border-strong);background:var(--pink-50);font-size:14px;font-weight:500;cursor:pointer;transition:all .2s;color:var(--text-mid);}
.topup-quick-amounts button:hover{background:var(--pink-100);border-color:var(--pink-400);color:var(--pink-600);}
@media(max-width:768px){.sidebar{display:none;}.stat-grid{grid-template-columns:1fr 1fr;}.nanny-grid{grid-template-columns:1fr;}.main{padding:20px;}.topbar{padding:12px 16px;}.wallet-amount{font-size:34px;}}

<script>
var API='';
var state={token:localStorage.getItem('sabi_token')||null,role:null,user:null,children:[],balance:0,loginRole:'parent',mode:'login',currentScreen:null,chatOrderId:null,chatPollTimer:null,chatLastId:0};

async function api(method,path,body){var h={'Content-Type':'application/json'};if(state.token)h['Authorization']='Bearer '+state.token;var res=await fetch(API+path,{method:method,headers:h,body:body?JSON.stringify(body):undefined});var data=await res.json();if(!res.ok)throw new Error(data.error||'Ошибка сервера');return data;}

var _tt;
function showToast(msg,type){var t=document.getElementById('toast');t.textContent=msg;t.className='toast show'+(type?' '+type:'');clearTimeout(_tt);_tt=setTimeout(function(){t.classList.remove('show');},3500);}
function showModal(html){document.getElementById('modal-root').innerHTML='<div class="modal-overlay" onclick="closeModalOverlay(event)">'+html+'</div>';}
function closeModal(){document.getElementById('modal-root').innerHTML='';}
function closeModalOverlay(e){if(e.target.classList.contains('modal-overlay'))closeModal();}

function setLoginRole(role){state.loginRole=role;document.querySelectorAll('.login-tab').forEach(function(t,i){t.classList.toggle('active',['parent','nanny','admin'][i]===role);});document.querySelectorAll('.reg-nanny-only').forEach(function(el){el.style.display=(role==='nanny'&&state.mode==='register')?'block':'none';});document.getElementById('tab-register').style.display=role==='admin'?'none':'';document.getElementById('switch-mode-link').style.display=role==='admin'?'none':'';if(role==='admin'&&state.mode==='register')setMode('login');}
function setMode(mode){state.mode=mode;var isReg=mode==='register';document.getElementById('reg-extra').style.display=isReg?'block':'none';document.querySelectorAll('.reg-nanny-only').forEach(function(el){el.style.display=(isReg&&state.loginRole==='nanny')?'block':'none';});document.getElementById('submit-btn').textContent=isReg?'Зарегистрироваться':'Войти';document.getElementById('switch-mode-link').innerHTML=isReg?'Уже есть аккаунт? <a onclick="setMode(\'login\')">Войти</a>':'Нет аккаунта? <a onclick="setMode(\'register\')">Зарегистрироваться</a>';var tl=document.getElementById('tab-login'),tr=document.getElementById('tab-register');tl.style.cssText=isReg?'flex:1;':'flex:1;background:var(--pink-500);color:#fff;border-color:var(--pink-500);';tr.style.cssText=isReg?'flex:1;background:var(--pink-500);color:#fff;border-color:var(--pink-500);':'flex:1;';document.getElementById('login-error').style.display='none';}
function showError(msg){var el=document.getElementById('login-error');el.textContent=msg;el.style.display=msg?'block':'none';}

async function handleSubmit(){var email=document.getElementById('inp-email').value.trim(),password=document.getElementById('inp-password').value,btn=document.getElementById('submit-btn');if(!email||!password){showError('Заполните email и пароль');return;}btn.innerHTML='<span class="loader"></span>Загрузка...';btn.disabled=true;showError('');try{var data;if(state.mode==='register'){var name=document.getElementById('inp-name').value.trim(),phone=document.getElementById('inp-phone').value.trim();if(!name){showError('Введите ваше имя');return;}var body={name:name,phone:phone,email:email,password:password};if(state.loginRole==='nanny')body.experience=parseInt(document.getElementById('inp-experience').value)||0;data=await api('POST','/api/auth/register/'+state.loginRole,body);}else{data=await api('POST','/api/auth/login',{email:email,password:password,role:state.loginRole});}state.token=data.token;state.role=data.role;state.user=data.user;localStorage.setItem('sabi_token',data.token);await enterApp();showToast(state.mode==='register'?'🌸 Регистрация успешна!':'Добро пожаловать!','success');}catch(err){showError(err.message);}finally{btn.innerHTML=state.mode==='register'?'Зарегистрироваться':'Войти';btn.disabled=false;}}
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&document.getElementById('page-login').style.display!=='none')handleSubmit();});

var ROLE_LABELS={parent:'Родитель',nanny:'Няня',admin:'Администратор'};
function renderRoleBadge(role){document.getElementById('role-badge-container').innerHTML='<div class="role-badge role-badge-'+role+'"><span class="dot"></span>Вы вошли как:&nbsp;<strong>'+(ROLE_LABELS[role]||role)+'</strong></div>';}

async function refreshBalance(){try{var r=await api('GET','/api/wallet/balance');state.balance=r.balance;updateBalanceChip();}catch(e){}}
function updateBalanceChip(){var chip=document.getElementById('topbar-balance');if(!chip)return;var b=state.balance;chip.textContent='💰 '+fmt(b)+' ₸';chip.className='balance-chip'+(b<1000?' low':'');chip.title='Кошелёк: '+fmt(b)+' ₸ (нажмите для пополнения)';}
function fmt(n){return Number(n||0).toLocaleString('ru',{minimumFractionDigits:0,maximumFractionDigits:2});}

async function enterApp(){document.getElementById('page-login').style.display='none';document.getElementById('page-app').style.display='block';var parts=(state.user&&state.user.name?state.user.name:'U').split(' ');document.getElementById('top-avatar').textContent=parts.map(function(w){return w[0];}).join('').slice(0,2).toUpperCase();document.getElementById('top-name').textContent=parts[0]+(parts[1]?' '+parts[1][0]+'.':'');renderRoleBadge(state.role);if(state.role==='admin'){document.getElementById('topbar-balance').style.display='none';}else{await refreshBalance();}if(state.role==='parent'){try{state.children=await api('GET','/api/children/my');}catch(e){state.children=[];}if(state.children.length===0){buildSidebar(state.role);showAddChildModal(true);return;}}buildSidebar(state.role);}
async function doLogout(){stopChatPoll();try{await api('POST','/api/auth/logout');}catch(e){}localStorage.removeItem('sabi_token');state.token=null;state.role=null;state.user=null;state.children=[];state.balance=0;document.getElementById('page-app').style.display='none';document.getElementById('page-login').style.display='flex';showToast('Вы вышли из системы');}

var NAV={
  parent:[{l:'Главная',i:'🏠',s:'parent-home'},{l:'Найти няню',i:'🔍',s:'search'},{l:'Мои заказы',i:'📋',s:'orders'},{l:'Кошелёк',i:'💰',s:'wallet'},{l:'Сообщения',i:'💬',s:'chats'},{l:'Профиль',i:'👤',s:'parent-profile'}],
  nanny: [{l:'Главная',i:'🏠',s:'nanny-home'},{l:'Мои заказы',i:'📋',s:'nanny-orders'},{l:'Расписание',i:'📅',s:'nanny-schedule'},{l:'Кошелёк',i:'💰',s:'wallet'},{l:'Сообщения',i:'💬',s:'chats'},{l:'Документы',i:'📄',s:'nanny-docs'},{l:'Профиль',i:'👤',s:'nanny-profile'}],
  admin: [{l:'Дашборд',i:'📊',s:'admin-home'},{l:'Пользователи',i:'👥',s:'admin-users'},{l:'Верификация',i:'✅',s:'admin-verify'},{l:'Все заказы',i:'📋',s:'admin-orders'},{l:'Финансы',i:'💹',s:'wallet'}],
};
function buildSidebar(role){var items=NAV[role]||[];document.getElementById('sidebar').innerHTML='<div class="nav-section">Меню</div>'+items.map(function(it){return '<button class="nav-item" data-screen="'+it.s+'" onclick="showScreen(\''+it.s+'\')">'+'<span class="nav-icon">'+it.i+'</span>'+it.l+'</button>';}).join('');if(items[0])showScreen(items[0].s);}
function showScreen(id){stopChatPoll();state.currentScreen=id;document.querySelectorAll('.nav-item').forEach(function(el){el.classList.toggle('active',el.dataset.screen===id);});document.getElementById('main-content').innerHTML='<div class="screen active">'+renderScreen(id)+'</div>';afterRender(id);}

function starsHTML(r){if(!r)return '<span style="color:var(--text-muted);font-size:12px;">Нет оценок</span>';var f=Math.round(r);return '<span class="stars">'+'★'.repeat(f)+'☆'.repeat(5-f)+'</span><span style="font-size:12px;color:var(--text-muted);margin-left:4px;">'+parseFloat(r).toFixed(1)+'</span>';}
var BM={'Верифицирована':'badge-green','На проверке':'badge-amber','Отказано':'badge-red','В процессе':'badge-pink','Подтверждён':'badge-blue','Завершён':'badge-gray','Ожидает':'badge-amber','Срочный':'badge-red','Плановый':'badge-blue','Активен':'badge-green','Свободна':'badge-green','Занята':'badge-amber','paid':'badge-green','pending':'badge-amber'};
function badge(t){return '<span class="badge '+(BM[t]||'badge-gray')+'">'+t+'</span>';}
var AV=['av-a','av-b','av-c','av-d','av-e'];
function avClass(id){return AV[((id||1)-1)%AV.length];}
function initials(n){return(n||'?').split(' ').map(function(w){return w[0];}).join('').slice(0,2).toUpperCase();}

function fmtTime(d){if(!d)return'';return new Date(d).toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'});}

// ── WALLET SCREEN ──
async function loadWalletScreen() {
    try {
        await refreshBalance();
        const bd = document.getElementById('wallet-balance-display');
        if (bd) bd.textContent = fmt(state.balance) + ' ₸';

        const actionsEl = document.getElementById('wallet-actions'); 
        if (actionsEl) {
            if (state.role === 'nanny') {
                // Если зашла няня — показываем кнопку вывода
                actionsEl.innerHTML = `
                    <button onclick="showWithdrawModal()" class="btn btn-primary" style="width:100%; margin-top:15px;">
                        Вывести на карту
                    </button>`;
            } else if (state.role === 'parent') {
                // Если зашел родитель — показываем кнопку пополнения
                actionsEl.innerHTML = `
                    <button onclick="showTopupModal()" class="btn btn-primary" style="width:100%; margin-top:15px;">
                        Пополнить баланс
                    </button>`;
            } else {
                actionsEl.innerHTML = ''; // Для админа можно оставить пустым
            }
        }

        // 1. Секция админа
        if (state.role === 'admin') {
            try {
                const s = await api('GET', '/api/wallet/admin/stats');
                const el = document.getElementById('admin-wallet-amount');
                if (el) el.textContent = fmt(s.platform_balance) + ' ₸';

                const st = document.getElementById('admin-wallet-stats');
                if (st) st.textContent = `Всего собрано комиссий: ${fmt(s.total_fees_earned)} ₸ · Платежей: ${s.payments_count}`;

                const sg = document.getElementById('admin-fin-stats');
                if (sg) {
                    // Здесь используем шаблонные строки для читаемости
                    sg.innerHTML = `
                        <div class="stat-card">
                            <div class="stat-label">Касса</div>
                            <div class="stat-value" style="font-size:24px;">${fmt(s.platform_balance)} ₸</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">Всего оборот</div>
                            <div class="stat-value" style="font-size:24px;">${fmt(s.total_payments)} ₸</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">Комиссий</div>
                            <div class="stat-value" style="font-size:24px;">${fmt(s.total_fees_earned)} ₸</div>
                        </div>`;
                }
            } catch (e) {
                console.error("Ошибка загрузки админ-статистики:", e);
            }
        }

        // 2. История транзакций
        const el = document.getElementById('tx-history');
        if (!el) return;

        const h = await api('GET', '/api/wallet/history');
        let all = [];

        // Общие пополнения для всех, у кого они есть в ответе
        if (h.topups) {
            h.topups.forEach(t => {
                all.push({
                    date: t.created_at,
                    icon: 'topup',
                    title: 'Пополнение баланса',
                    meta: 'Метод: ' + (t.method || 'не указан'),
                    amount: '+' + fmt(t.amount) + ' ₸',
                    cls: 'plus'
                });
            });
        }

        // Обработка транзакций по ролям
        if (h.transactions) {
            h.transactions.forEach(t => {
                if (state.role === 'parent') {
                    all.push({
                        date: t.created_at,
                        icon: 'pay',
                        title: `Оплата заказа #${t.order_id || ''}`,
                        meta: (t.nanny_name ? `Няня: ${t.nanny_name} · ` : '') + `${fmt(t.platform_fee)} ₸ комиссия`,
                        amount: `-${fmt(t.total_amount)} ₸`,
                        cls: 'minus'
                    });
                } else if (state.role === 'nanny') {
                    all.push({
                        date: t.created_at,
                        icon: 'earn',
                        title: `Оплата за заказ #${t.order_id || ''}`,
                        meta: (t.parent_name ? `От: ${t.parent_name} · ` : '') + `Получено: ${fmt(t.nanny_amount)} ₸`,
                        amount: `+${fmt(t.nanny_amount)} ₸`,
                        cls: 'plus'
                    });
                } else {
                    // Для админа
                    all.push({
                        date: t.created_at,
                        icon: 'pay',
                        title: `Транзакция #${t.id}`,
                        meta: `${t.parent_name || 'Система'} → ${t.nanny_name || 'Няня'}`,
                        amount: `Итого: ${fmt(t.total_amount)} ₸`,
                        cls: 'plus'
                    });
                }
            });
        }

        // Если няня — рендерим статистику заработка
        if (state.role === 'nanny') {
            renderEarningsStats(h.transactions || []);
        }

        // Сортировка
        all.sort((a, b) => new Date(b.date) - new Date(a.date));

        if (all.length === 0) {
            el.innerHTML = '<div style="color:var(--text-muted);padding:24px;text-align:center;">Операций пока нет</div>';
            return;
        }

        const ICONS = { pay: '💸', topup: '💳', earn: '💵' };

        // Рендер (рекомендуется экранировать t.title и t.meta перед вставкой)
        el.innerHTML = all.map(t => `
            <div class="tx-item">
                <div class="tx-icon ${t.icon}">${ICONS[t.icon]}</div>
                <div class="tx-info" style="flex:1;min-width:0;">
                    <div class="tx-title">${t.title}</div>
                    <div class="tx-meta">${t.meta}</div>
                    <div class="tx-meta">${fmtDate(t.date)}</div>
                </div>
                <div class="tx-amount ${t.cls}">${t.amount}</div>
            </div>
        `).join('');

    } catch (err) {
        console.error("Ошибка loadWalletScreen:", err);
        const el = document.getElementById('tx-history');
        if (el) el.innerHTML = '<div style="color:var(--text-muted);padding:24px;text-align:center;">Ошибка загрузки данных</div>';
    }
}



// ── FINANCE MODAL (пополнение / вывод) ──
var _finAction = 'topup';
function openFinModal(action) {
  _finAction = action;
  var isTopup = action === 'topup';
  document.getElementById('fin-modal-badge').textContent = isTopup ? '💳 Пополнение' : '💸 Вывод средств';
  document.getElementById('fin-modal-badge').className = 'fin-modal-badge ' + (isTopup ? 'topup' : 'withdraw');
  document.getElementById('fin-modal-title').textContent = isTopup ? 'Пополнить баланс' : 'Вывести средства';
  document.getElementById('fin-modal-balance-val').textContent = fmt(state.balance) + ' ₸';
  var confirmBtn = document.getElementById('fin-confirm-btn');
  confirmBtn.textContent = isTopup ? 'Пополнить' : 'Вывести';
  confirmBtn.className = 'fin-btn ' + (isTopup ? 'fin-btn-confirm-topup' : 'fin-btn-confirm-withdraw');
  document.getElementById('fin-quick-amounts').innerHTML = isTopup
    ? '<button class="fin-quick-btn" onclick="setFinAmount(5000)">5 000</button><button class="fin-quick-btn" onclick="setFinAmount(10000)">10 000</button><button class="fin-quick-btn" onclick="setFinAmount(20000)">20 000</button><button class="fin-quick-btn" onclick="setFinAmount(50000)">50 000</button>'
    : '<button class="fin-quick-btn" onclick="setFinAmount(5000)">5 000</button><button class="fin-quick-btn" onclick="setFinAmount(10000)">10 000</button><button class="fin-quick-btn" onclick="setFinAmount(state.balance)">Весь баланс</button>';
  document.getElementById('fin-amount').value = '';
  document.getElementById('fin-card-number').value = '';
  document.getElementById('fin-card-expiry').value = '';
  document.getElementById('fin-card-cvv').value = '';
  document.getElementById('fin-modal').style.display = 'flex';
}
function showTopupModal() { openFinModal('topup'); }
function showWithdrawModal() { openFinModal('withdraw'); }
function showWithdrawInfo() { openFinModal('withdraw'); }
function closeFinModal() { document.getElementById('fin-modal').style.display = 'none'; }
function closeTopupModal() { closeFinModal(); }
function finModalOverlayClick(e) { if (e.target.id === 'fin-modal') closeFinModal(); }
function setFinAmount(n) { var el=document.getElementById('fin-amount'); if(el) el.value=Math.floor(n); }
function fmtCardNum(inp) { var v=inp.value.replace(/\D/g,'').slice(0,16); inp.value=v.replace(/(.{4})/g,'$1 ').trim(); }
function fmtExpiry(inp) { var v=inp.value.replace(/\D/g,'').slice(0,4); if(v.length>=3) v=v.slice(0,2)+'/'+v.slice(2); inp.value=v; }
async function handleFinAction() {
  var amount = parseFloat(document.getElementById('fin-amount').value);
  var btn = document.getElementById('fin-confirm-btn');
  if (!amount || amount < 100) { showToast('Минимальная сумма — 100 ₸', 'error'); return; }
  if (_finAction === 'withdraw' && amount > state.balance) { showToast('Недостаточно средств для вывода', 'error'); return; }
  btn.disabled = true;
  var origText = btn.textContent;
  btn.textContent = 'Обработка...';
  try {
    if (_finAction === 'topup') {
      var r = await api('POST', '/api/wallet/topup', {amount: amount, method: 'card'});
      state.balance = r.balance; updateBalanceChip(); closeFinModal();
      showToast('✅ Баланс пополнен на '+fmt(amount)+' ₸! Новый баланс: '+fmt(r.balance)+' ₸', 'success');
      if (state.currentScreen === 'wallet') loadWalletScreen();
      if (state.currentScreen === 'parent-home') { var bd=document.getElementById('stat-balance'); if(bd) bd.textContent=fmt(state.balance)+' ₸'; }
    } else {
      await api('POST', '/api/wallet/withdraw', {amount: amount, method: 'card'});
      closeFinModal();
      showToast('✅ Заявка на вывод '+fmt(amount)+' ₸ принята! Деньги придут в течение 24 часов.', 'success');
      await refreshBalance();
      if (state.currentScreen === 'wallet') loadWalletScreen();
    }
  } catch(err) { showToast('Ошибка: '+err.message, 'error'); }
  finally { btn.disabled=false; btn.textContent=origText; }
}
async function doTopup() { await handleFinAction(); }

async function payOrder(orderId,amount){
  showModal('<div class="modal-card">'+
    '<div class="modal-title">💸 Оплата заказа #'+orderId+'</div>'+
    '<div style="margin-bottom:20px;">'+
    '<div style="font-size:15px;margin-bottom:12px;">Стоимость услуг: <strong>'+fmt(amount)+' ₸</strong></div>'+
    '<div class="tx-item" style="margin-bottom:8px;"><div class="tx-icon earn">💵</div><div class="tx-info"><div class="tx-title">Выплата няне (90%)</div></div><div class="tx-amount plus">'+fmt(amount*0.9)+' ₸</div></div>'+
    '<div class="tx-item"><div class="tx-icon pay">🏦</div><div class="tx-info"><div class="tx-title">Комиссия SabiTrack (10%)</div></div><div class="tx-amount minus">'+fmt(amount*0.1)+' ₸</div></div>'+
    '<div class="divider"></div>'+
    '<div style="display:flex;justify-content:space-between;font-size:15px;font-weight:600;padding:0 4px;"><span>Итого спишется с баланса:</span><span style="color:var(--pink-600);">'+fmt(amount)+' ₸</span></div>'+
    '<div style="font-size:13px;color:var(--text-muted);margin-top:8px;">Ваш баланс: '+fmt(state.balance)+' ₸</div>'+
    (state.balance<amount?'<div class="info-banner" style="margin-top:12px;">⚠️ Недостаточно средств. <a onclick="closeModal();showTopupModal();" style="color:var(--pink-600);cursor:pointer;text-decoration:underline;">Пополнить баланс →</a></div>':'')+
    '</div>'+
    '<div class="modal-actions">'+
      '<button class="btn" onclick="closeModal()">Отмена</button>'+
      (state.balance>=amount?'<button class="btn btn-primary" onclick="confirmPayOrder('+orderId+')">Оплатить с баланса</button>':'<button class="btn btn-primary" onclick="closeModal();showTopupModal();">Пополнить баланс</button>')+
    '</div></div>');
}

async function confirmPayOrder(orderId){
  try{
    var r=await api('POST','/api/wallet/pay-order',{order_id:orderId});
    state.balance=r.new_balance;
    updateBalanceChip();
    closeModal();
    showToast('✅ Оплата прошла! Списано: '+fmt(r.total)+' ₸ (комиссия '+fmt(r.fee)+' ₸)','success');
    afterRender(state.currentScreen);
    if(state.currentScreen==='wallet')loadWalletScreen();
  }catch(err){closeModal();showToast(err.message,'error');}
}

async function renderMyDocs(){var el=document.getElementById('docs-list');if(!el)return;try{var docs=await api('GET','/api/documents/my');if(!docs.length){el.innerHTML='<div class="info-banner">📭 Документов пока нет. Загрузите дипломы и сертификаты для верификации.</div>';return;}el.innerHTML=docs.map(function(d){return '<div class="doc-card"><div style="display:flex;align-items:center;gap:14px;flex:1;min-width:0;"><div class="doc-icon">'+docIcon(d.mime_type)+'</div><div class="doc-info"><div class="doc-title">'+d.title+'</div><div class="doc-meta">'+d.file_name+'</div><div class="doc-type-badge">'+(DOCTYPE_LABELS[d.doc_type]||d.doc_type)+'</div><div class="doc-meta">'+fmtDate(d.created_at)+'</div></div></div><div style="display:flex;gap:8px;flex-shrink:0;"><button class="btn btn-sm" onclick="previewDoc('+d.id+')">👁 Просмотр</button><button class="btn btn-sm btn-danger" onclick="deleteDoc('+d.id+')">Удалить</button></div></div>';}).join('');}catch(err){el.innerHTML='<div style="color:var(--text-muted);">Ошибка загрузки</div>';}}

function showUploadDocModal(){showModal('<div class="modal-card"><div class="modal-title">📎 Загрузить документ</div><div class="form-group"><label class="form-label">Тип документа</label><select class="form-input" id="doc-type"><option value="diploma">🎓 Диплом об образовании</option><option value="certificate">🏅 Сертификат / Курс</option><option value="id">🪪 Удостоверение личности</option><option value="other">📎 Другое</option></select></div><div class="form-group"><label class="form-label">Название документа</label><input class="form-input" id="doc-title" placeholder="Диплом КазНУ, 2019"></div><div class="form-group"><label class="form-label">Файл (JPG, PNG, PDF — до 3 МБ)</label><div class="doc-upload-area" onclick="document.getElementById(\'doc-file\').click()"><input type="file" id="doc-file" accept=".jpg,.jpeg,.png,.webp,.pdf" onchange="handleFileSelect(event)"><div id="doc-file-label">📎 Нажмите для выбора файла</div></div></div><div class="modal-actions"><button class="btn" onclick="closeModal()">Отмена</button><button class="btn btn-primary" onclick="uploadDoc()">Загрузить</button></div></div>');}
var _selectedFile=null;
function handleFileSelect(e){var file=e.target.files[0];if(!file)return;_selectedFile=file;var label=document.getElementById('doc-file-label');if(label)label.innerHTML='✅ '+file.name+' ('+Math.round(file.size/1024)+' КБ)';}
async function uploadDoc(){var docType=(document.getElementById('doc-type')||{}).value,title=((document.getElementById('doc-title')||{}).value||'').trim();if(!title){showToast('Введите название документа','error');return;}if(!_selectedFile){showToast('Выберите файл','error');return;}if(_selectedFile.size>3*1024*1024){showToast('Файл слишком большой (макс. 3 МБ)','error');return;}var reader=new FileReader();reader.onload=async function(e){try{await api('POST','/api/documents',{doc_type:docType,title:title,file_data:e.target.result,file_name:_selectedFile.name,mime_type:_selectedFile.type});_selectedFile=null;closeModal();showToast('Документ загружен!','success');renderMyDocs();}catch(err){showToast(err.message,'error');} };reader.readAsDataURL(_selectedFile);}
async function previewDoc(docId){try{var d=await api('GET','/api/documents/'+docId+'/file');if(d.mime_type&&d.mime_type.includes('pdf')){var b64=d.file_data.includes(',')?d.file_data.split(',')[1]:d.file_data,byteChars=atob(b64),byteNums=new Array(byteChars.length);for(var i=0;i<byteChars.length;i++)byteNums[i]=byteChars.charCodeAt(i);var blob=new Blob([new Uint8Array(byteNums)],{type:'application/pdf'});window.open(URL.createObjectURL(blob),'_blank');}else{showModal('<div class="modal-card" style="width:90vw;max-width:700px;"><div class="modal-title">'+d.file_name+'</div><img src="'+d.file_data+'" style="width:100%;border-radius:var(--r-lg);max-height:60vh;object-fit:contain;" /><div class="modal-actions"><button class="btn" onclick="closeModal()">Закрыть</button><a class="btn btn-primary" href="'+d.file_data+'" download="'+d.file_name+'">⬇ Скачать</a></div></div>');}}catch(err){showToast(err.message,'error');}}
async function deleteDoc(docId){if(!confirm('Удалить документ?'))return;try{await api('DELETE','/api/documents/'+docId);showToast('Документ удалён');renderMyDocs();}catch(err){showToast(err.message,'error');}}

async function renderChatsList(){var el=document.getElementById('chats-list');if(!el)return;try{var orders=await api('GET','/api/orders/my');var active=orders.filter(function(o){return o.status==='В процессе'||o.status==='Подтверждён';});if(!active.length){el.innerHTML='<div style="color:var(--text-muted);padding:24px;text-align:center;">💬 Нет активных заказов для переписки</div>';return;}el.innerHTML=active.map(function(o){var partner=state.role==='parent'?(o.nanny_name||'Няня'):(o.parent_name||'Родитель');return '<div class="chat-list-item" onclick="openChat('+o.id+',\''+esc(partner)+'\')"><div class="chat-header-avatar">'+initials(partner)+'</div><div><div style="font-weight:600;font-size:15px;">'+partner+'</div><div style="font-size:13px;color:var(--text-muted);">'+badge(o.status)+' · Заказ #'+o.id+'</div></div></div>';}).join('');}catch(err){el.innerHTML='<div style="color:var(--text-muted);">Ошибка загрузки</div>';}}

function openChat(orderId,partnerName){stopChatPoll();state.chatOrderId=orderId;state.chatLastId=0;document.getElementById('main-content').innerHTML='<div class="screen active"><div class="chat-wrap"><div class="chat-header"><div class="chat-header-avatar">'+initials(partnerName)+'</div><div class="chat-header-info"><div class="chat-name">'+partnerName+'</div><div class="chat-sub">Заказ #'+orderId+'</div></div><button class="btn btn-sm" style="margin-left:auto;" onclick="showScreen(\'chats\')">← Назад</button></div><div class="chat-messages" id="chat-messages"><div class="chat-empty">Загрузка...</div></div><div class="chat-input-area"><input type="file" id="chat-image" accept="image/*" style="display:none" onchange="previewImage(event)"><button class="chat-send-btn" style="background:#f8d7e3;margin-right:4px;" onclick="document.getElementById(\'chat-image\').click()">📷</button><div style="flex:1;display:flex;flex-direction:column;gap:4px;"><div id="image-preview" style="display:none;align-items:center;gap:6px;"><img id="preview-img" style="max-height:60px;border-radius:8px;"><button onclick="clearImage()" style="background:none;border:none;cursor:pointer;color:red;font-size:16px;">✕</button></div><textarea class="chat-input" id="chat-input" placeholder="Написать сообщение..." rows="1" onkeydown="chatKeydown(event)"></textarea></div><button class="chat-send-btn" onclick="sendMessage()">➤</button></div></div></div>';loadMessages(true);state.chatPollTimer=setInterval(function(){loadMessages(false);},3000);}

async function loadMessages(initial){var el=document.getElementById('chat-messages');if(!el)return;try{var msgs=await api('GET','/api/messages/'+state.chatOrderId+'?after='+state.chatLastId);if(!msgs.length&&initial){el.innerHTML='<div class="chat-empty">Начните переписку! 👋</div>';return;}if(!msgs.length)return;if(initial)el.innerHTML='';msgs.forEach(function(m){var isMe=(state.role===m.sender_role&&state.user&&String(state.user.id)===String(m.sender_id));var row=document.createElement('div');row.className='msg-row '+(isMe?'mine':'theirs');row.innerHTML='<div class="msg-bubble">'+(m.image_url?'<img src="'+m.image_url+'" style="max-width:200px;border-radius:8px;display:block;margin-bottom:4px;">':'')+(m.text?escHtml(m.text):'')+'</div><div class="msg-meta">'+(isMe?'Вы':m.sender_name)+' · '+fmtTime(m.created_at)+'</div>';el.appendChild(row);state.chatLastId=Math.max(state.chatLastId,m.id);});el.scrollTop=el.scrollHeight;}catch(err){console.error('Chat poll',err);}}

async function sendMessage(){var inp=document.getElementById('chat-input');var imgInput=document.getElementById('chat-image');if(!inp)return;var text=inp.value.trim();var file=imgInput&&imgInput.files[0];if(!text&&!file)return;inp.value='';try{if(file){var fd=new FormData();fd.append('order_id',state.chatOrderId);if(text)fd.append('text',text);fd.append('image',file);await fetch('/api/messages',{method:'POST',headers:{'Authorization':'Bearer '+state.token},body:fd});clearImage();}else{await api('POST','/api/messages',{order_id:state.chatOrderId,text:text});}loadMessages(false);}catch(err){showToast(err.message,'error');}}

function previewImage(e){var file=e.target.files[0];if(!file)return;var reader=new FileReader();reader.onload=function(ev){document.getElementById('preview-img').src=ev.target.result;document.getElementById('image-preview').style.display='flex';};reader.readAsDataURL(file);}

function clearImage(){document.getElementById('chat-image').value='';document.getElementById('image-preview').style.display='none';}

function chatKeydown(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();}}

function stopChatPoll(){if(state.chatPollTimer){clearInterval(state.chatPollTimer);state.chatPollTimer=null;}state.chatOrderId=null;state.chatLastId=0;}

function escHtml(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');}

function filterNannies(){var q=(document.getElementById('sq')?document.getElementById('sq').value:'').toLowerCase(),avail=document.getElementById('sf-avail')?document.getElementById('sf-avail').value:'',exp=parseInt(document.getElementById('sf-exp')?document.getElementById('sf-exp').value:0)||0;var filtered=allNannies.filter(function(n){if(q&&!n.name.toLowerCase().includes(q))return false;if(avail==='true'&&!n.available)return false;if(exp&&n.experience<exp)return false;return true;});var el=document.getElementById('search-results');if(el)el.innerHTML=filtered.length?filtered.map(nannyCardHTML).join(''):'<div style="color:var(--text-muted);padding:24px;text-align:center;">Ничего не найдено</div>';}

async function saveChild(){var name=((document.getElementById('mc-name')||{}).value||'').trim(),age=parseInt((document.getElementById('mc-age')||{}).value),features=((document.getElementById('mc-features')||{}).value||'').trim(),allergies=((document.getElementById('mc-allergies')||{}).value||'').trim(),medications=((document.getElementById('mc-medications')||{}).value||'').trim();if(!name){showToast('Введите имя ребёнка','error');return;}if(isNaN(age)){showToast('Введите возраст','error');return;}try{var c=await api('POST','/api/children',{name:name,age:age,features:features,allergies:allergies,medications:medications});state.children.push(c);closeModal();showToast('Данные ребёнка сохранены!','success');if(state.currentScreen==='parent-profile')renderChildrenList();if(state.children.length===1)buildSidebar(state.role);}catch(err){showToast(err.message,'error');}}async function updateChild(id){var name=((document.getElementById('mc-name')||{}).value||'').trim(),age=parseInt((document.getElementById('mc-age')||{}).value),features=((document.getElementById('mc-features')||{}).value||'').trim(),allergies=((document.getElementById('mc-allergies')||{}).value||'').trim(),medications=((document.getElementById('mc-medications')||{}).value||'').trim();if(!name){showToast('Введите имя','error');return;}try{var u=await api('PATCH','/api/children/'+id,{name:name,age:age,features:features,allergies:allergies,medications:medications});state.children=state.children.map(function(c){return c.id===id?u:c;});closeModal();showToast('Данные обновлены!','success');renderChildrenList();}catch(err){showToast(err.message,'error');}}
async function confirmBooking(nid,nname){var cid=parseInt((document.getElementById('bk-child')||{}).value),ot=(document.getElementById('bk-type')||{}).value,ds=(document.getElementById('bk-start')||{}).value,de=(document.getElementById('bk-end')||{}).value||null,amt=parseFloat((document.getElementById('bk-amount')||{}).value);if(!ds){showToast('Укажите дату начала','error');return;}if(de&&ds>=de){showToast('Дата окончания должна быть позже начала','error');return;}try{await api('POST','/api/orders',{nanny_id:nid,child_id:cid,order_type:ot,date_start:ds,date_end:de,amount:amt});closeModal();showToast('✅ Заказ для '+nname+' создан!','success');afterRender(state.currentScreen);}catch(err){showToast(err.message,'error');}}

// ── NANNY EARNINGS STATS ──
var _earningsPeriodMonths = 1;
var _earningsCache = null; // cached transactions from API

function setEarningsPeriod(months, btn) {
  _earningsPeriodMonths = months;
  // Update tab active state
  document.querySelectorAll('.period-tab').forEach(function(b){ b.classList.remove('active'); });
  if (btn) btn.classList.add('active');
  renderEarningsStats(_earningsCache);
}

function renderEarningsStats(transactions) {
  _earningsCache = transactions;
  var el = document.getElementById('earnings-stats');
  if (!el) return;
  if (!transactions || transactions.length === 0) {
    el.innerHTML = '<div style="color:var(--text-muted);font-size:13px;grid-column:1/-1;padding:8px 0;">За этот период заказов нет</div>';
    return;
  }

  // Filter by period
  var now = new Date();
  var filtered = transactions.filter(function(t) {
    if (_earningsPeriodMonths === 0) return true; // all time
    var d = new Date(t.created_at || t.date);
    var diffMs = now - d;
    var diffDays = diffMs / (1000 * 60 * 60 * 24);
    return diffDays <= (_earningsPeriodMonths * 30.5);
  });

  var totalEarned = filtered.reduce(function(sum, t) {
    return sum + parseFloat(t.nanny_amount || 0);
  }, 0);
  var ordersCount = filtered.length;
  var avgEarned = ordersCount > 0 ? totalEarned / ordersCount : 0;

  // Period label
  var periodLabel = _earningsPeriodMonths === 0 ? 'За всё время'
    : _earningsPeriodMonths === 1 ? 'За последний месяц'
    : 'За последние 2 месяца';

  el.innerHTML =
    '<div class="earn-stat-card green">' +
      '<div class="earn-stat-label">Заработано</div>' +
      '<div class="earn-stat-val">' + fmt(totalEarned) + ' ₸</div>' +
      '<div class="earn-stat-sub">' + periodLabel + '</div>' +
    '</div>' +
    '<div class="earn-stat-card blue">' +
      '<div class="earn-stat-label">Выполнено заказов</div>' +
      '<div class="earn-stat-val">' + ordersCount + '</div>' +
      '<div class="earn-stat-sub">' + periodLabel + '</div>' +
    '</div>' +
    '<div class="earn-stat-card">' +
      '<div class="earn-stat-label">Средний чек</div>' +
      '<div class="earn-stat-val">' + fmt(Math.round(avgEarned)) + ' ₸</div>' +
      '<div class="earn-stat-sub">на один заказ</div>' +
    '</div>';
}

// ── NANNY SCHEDULE ──
function buildNannyScheduleHTML(orders) {
  var today = new Date(); today.setHours(0,0,0,0);
  var days = [];
  for (var i=0; i<7; i++) { var d=new Date(today); d.setDate(today.getDate()+i); days.push(d); }
  var DN=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
  var MN=['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
  var byDay={};
  (orders||[]).forEach(function(o){
    if(!o.date_start||o.status==='Отклонён'||o.status==='Отклонено')return;
    var ds=new Date(o.date_start), key=ds.toDateString();
    if(!byDay[key])byDay[key]=[];
    byDay[key].push(o);
  });
  var html='<div class="schedule-wrap">';
  html+='<div class="schedule-legend"><span><span class="sleg-dot" style="background:#f48fb1;border:1px solid #e91e8c;"></span>Занятость</span><span><span class="sleg-dot" style="background:#a7e9c0;border:1px dashed #2e7d32;"></span>Свободно</span></div>';
  html+='<div class="schedule-week">';
  days.forEach(function(d){
    var isToday=d.toDateString()===new Date().toDateString();
    html+='<div class="schedule-day-label" style="'+(isToday?'color:var(--pink-600);':'')+'">'+DN[d.getDay()]+'<br><span style="font-size:13px;font-weight:400;">'+d.getDate()+' '+MN[d.getMonth()]+'</span></div>';
  });
  days.forEach(function(d){
    html+='<div class="schedule-day-col">';
    var dayOrders=byDay[d.toDateString()]||[];
    if(!dayOrders.length){
      html+='<div class="schedule-slot free-gap" style="text-align:center;">свободно</div>';
    } else {
      dayOrders.forEach(function(o){
        var ds=new Date(o.date_start);
        var de=o.date_end?new Date(o.date_end):null;
        var t=ds.getHours().toString().padStart(2,'0')+':'+ds.getMinutes().toString().padStart(2,'0');
        if(de)t+='–'+de.getHours().toString().padStart(2,'0')+':'+de.getMinutes().toString().padStart(2,'0');
        html+='<div class="schedule-slot busy" title="'+(o.parent_name||'Родитель')+' · '+t+'">'+t+'<br>'+(o.parent_name?o.parent_name.split(' ')[0]:'#'+o.id)+'</div>';
      });
    }
    html+='</div>';
  });
  html+='</div></div>';
  return html;
}

async function loadNannySchedule(){
  var el=document.getElementById('nanny-schedule-content');
  if(!el)return;
  try{var orders=await api('GET','/api/orders/my');el.innerHTML=buildNannyScheduleHTML(orders);}
  catch(err){el.innerHTML='<div style="color:var(--text-muted);padding:16px;">Ошибка загрузки</div>';}
}
